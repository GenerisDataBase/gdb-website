name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify site, account deletion and badge catalogue
        run: |
          python3 tools/check_site.py
          node --check public/assets/js/qwizzy-account-deletion.mjs
          node --check public/assets/js/qwizzy-badges.mjs
          node tools/test_account_deletion.mjs
          node tools/test_badge_catalog.mjs

      - name: Prepare static site with clean URLs
        run: python3 tools/build_site.py --version "${GITHUB_SHA::8}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
