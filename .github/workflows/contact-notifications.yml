name: Contact form email notifications

on:
  schedule:
    # GitHub schedules use UTC and may start a few minutes late during busy periods.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: contact-email-notifications
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    if: vars.CONTACT_EMAIL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send new contact messages by email
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 tools/contact_notifications.py
