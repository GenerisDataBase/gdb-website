name: Weekly Qwizzy export

on:
  schedule:
    # Saturdays at 07:00 UTC — 09:00 German summer time, 08:00 in winter.
    # GitHub cron is always UTC and has no daylight saving.
    - cron: "0 7 * * 6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report, send nothing and change nothing"
        type: boolean
        default: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect questions and send the mail
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MIN_UPVOTES: "25"
          MIN_SCORE: "0"
        run: |
          python3 tools/weekly_export.py ${{ inputs.dry_run && '--dry-run' || '' }}
