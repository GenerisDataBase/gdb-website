<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio console — Generis Data Base</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="theme-color" content="#08080a">
<script>document.documentElement.dataset.theme = localStorage.getItem("gdb-theme") || "dark";</script>
<link rel="stylesheet" href="/assets/css/site.css">
<script defer src="/assets/js/fx.js"></script>
<style>
  .gate { max-width: 520px; margin: 0 auto; text-align: center; padding: clamp(30px, 5vw, 54px); }
  .toolbar {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    padding: 15px 18px; margin-bottom: 20px;
    background: var(--ink-2); border: 1px solid var(--line-soft); border-radius: var(--radius);
    position: sticky; top: 78px; z-index: 20; backdrop-filter: blur(14px);
  }
  .msg { border-left: 3px solid var(--accent); }
  .msg.handled { border-left-color: var(--line); opacity: .6; }
  .msg pre { white-space: pre-wrap; word-break: break-word; font: inherit; margin: 12px 0 0; color: var(--muted); }
</style>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-head is-stuck">
  <div class="shell head-inner">
    <a class="brand" href="/">
      <img data-crest data-dark="/assets/img/crest-white-sm.png" data-light="/assets/img/crest-black-sm.png"
           src="/assets/img/crest-white-sm.png" alt="" width="38" height="41">
      <span class="brand-text">
        <span class="brand-name">Studio console</span>
        <span class="brand-sub">Generis Data Base</span>
      </span>
    </a>
    <div class="head-tools" style="margin-left:auto">
      <button class="icon-btn theme-toggle" type="button" aria-label="Toggle colour theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="btn btn-ghost btn-sm hide" id="signOut" type="button">Sign out</button>
    </div>
  </div>
</header>

<main id="main-content">
  <section class="section" style="padding-top:130px">
    <div class="shell">

      <!-- ============ SIGN IN GATE ============ -->
      <div class="card gate" id="gate">
        <img src="/assets/img/crest-white.png" data-crest
             data-dark="/assets/img/crest-white.png" data-light="/assets/img/crest-black.png"
             alt="" width="86" style="margin:0 auto 26px">
        <h1 class="h-md" style="margin-bottom:12px">Studio console</h1>
        <p style="color:var(--muted);margin-bottom:26px">Sign in with the studio Google account to read and manage
          the contact inbox.</p>
        <button class="btn btn-block" id="signIn" type="button">Sign in with Google</button>
        <p class="hint" id="gateHint" style="margin-top:18px"></p>
      </div>

      <!-- ============ CONSOLE ============ -->
      <div class="hide" id="console">
        <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:22px">
          <h1 class="h-md">Contact inbox</h1>
          <span class="chip" id="inboxCount"></span>
        </div>
        <div>
          <div class="toolbar">
            <span style="color:var(--muted);font-size:.85rem">Replies go out from your own mail app — the sender never
              sees your address until you answer.</span>
            <button class="btn btn-ghost btn-sm" id="reloadMsgs" type="button" style="margin-left:auto">Reload</button>
          </div>
          <div id="mList" style="display:grid;gap:14px"></div>
        </div>

      </div>

    </div>
  </section>
</main>

<script type="module">
import {
  onUser, signInAdmin, signOutAdmin, isAdmin,
  listMessages, markHandled, removeMessage,
  friendlyError, whenText,
} from "/assets/js/db.js";

const $ = (s) => document.querySelector(s);
const escape = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let messages = [];

/* ---------------- auth ---------------- */
$("#signIn").addEventListener("click", async () => {
  try { await signInAdmin(); }
  catch (err) { $("#gateHint").textContent = friendlyError(err); }
});
$("#signOut").addEventListener("click", () => signOutAdmin());

onUser(async (user) => {
  if (isAdmin(user)) {
    $("#gate").classList.add("hide");
    $("#console").classList.remove("hide");
    $("#signOut").classList.remove("hide");
    await loadMessages();
  } else {
    $("#gate").classList.remove("hide");
    $("#console").classList.add("hide");
    $("#signOut").classList.add("hide");
  }
});

/* ---------------- messages ---------------- */
function paintMessages() {
  const unread = messages.filter((m) => !m.handled).length;
  $("#inboxCount").textContent = unread ? `${unread} open` : "All handled";
  if (!messages.length) {
    $("#mList").innerHTML = '<div class="empty">The inbox is empty.</div>';
    return;
  }
  $("#mList").innerHTML = messages.map((m) => {
    const subject = `Re: ${m.subject || "your message"} — Generis Data Base`;
    const greeting = `Hi ${(m.name || "").split(" ")[0] || "there"},\n\n`;
    const mailto = `mailto:${encodeURIComponent(m.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(greeting)}`;
    return `
    <article class="card msg ${m.handled ? "handled" : ""}" data-id="${m.id}" style="padding:22px 24px">
      <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <strong>${escape(m.name)}</strong>
        <a href="mailto:${escape(m.email)}" style="color:var(--accent);font-size:.88rem">${escape(m.email)}</a>
        <span class="chip">${escape(m.subject || "General")}</span>
        <span class="chip">${escape(whenText(m.createdAt))}</span>
      </div>
      <pre>${escape(m.body)}</pre>
      <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:18px">
        <a class="btn btn-sm" href="${mailto}">Reply by email</a>
        <button class="btn btn-ghost btn-sm" data-handled>${m.handled ? "Mark unhandled" : "Mark handled"}</button>
        <button class="btn btn-ghost btn-sm" data-delmsg style="color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)">Delete</button>
      </div>
    </article>`;
  }).join("");
}

$("#mList").addEventListener("click", async (e) => {
  const card = e.target.closest(".msg");
  if (!card) return;
  const id = card.dataset.id;
  const item = messages.find((m) => m.id === id);

  if (e.target.closest("[data-handled]")) {
    try {
      await markHandled(id, !item.handled);
      item.handled = !item.handled;
      paintMessages();
    } catch (err) { window.toast(friendlyError(err), "err"); }
  }

  if (e.target.closest("[data-delmsg]")) {
    if (!confirm("Delete this message permanently?")) return;
    try {
      await removeMessage(id);
      messages = messages.filter((m) => m.id !== id);
      paintMessages();
      window.toast("Deleted.", "ok");
    } catch (err) { window.toast(friendlyError(err), "err"); }
  }
});

$("#reloadMsgs").addEventListener("click", loadMessages);

async function loadMessages() {
  try {
    messages = await listMessages();
    paintMessages();
  } catch (err) {
    $("#mList").innerHTML = `<div class="notice bad"><span>${escape(friendlyError(err))}</span></div>`;
  }
}
</script>

</body>
</html>
