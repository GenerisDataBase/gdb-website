<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Wiksy's search bar appearing directly beneath the MacBook's camera notch">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1e26"/>
      <stop offset="1" stop-color="#101117"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#55b9e8" stop-opacity=".16"/>
      <stop offset="55%" stop-color="#55b9e8" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#55b9e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillFill" x1="0" y1="0" x2="1" y2=".3">
      <stop offset="0" stop-color="#aeb6c2" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#4c5566" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2c72a8" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="pillStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7edf5" stop-opacity=".8"/>
      <stop offset="1" stop-color="#e7edf5" stop-opacity=".18"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="screenClip">
      <path d="M18 0h604c10 0 18 8 18 18v402H0V18C0 8 8 0 18 0Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#screenClip)">
    <rect width="640" height="420" fill="#08080d"/>
    <rect width="640" height="420" fill="url(#screenGlow)"/>

    <!-- desktop hint: faint scattered stars, echoing the rest of the site -->
    <g fill="#ffffff" opacity=".5">
      <circle cx="70" cy="330" r="1.4"/><circle cx="130" cy="270" r="1"/><circle cx="200" cy="365" r="1.3"/>
      <circle cx="500" cy="300" r="1.2"/><circle cx="560" cy="360" r="1"/><circle cx="440" cy="230" r="1"/>
      <circle cx="90" cy="200" r="1"/><circle cx="580" cy="240" r="1.3"/><circle cx="330" cy="390" r="1"/>
    </g>

    <!-- top bezel strip, representing the very top edge of the MacBook screen -->
    <rect x="0" y="0" width="640" height="46" fill="url(#bezel)"/>
    <rect x="0" y="45" width="640" height="1" fill="#000" opacity=".6"/>

    <!-- the notch -->
    <path d="M266 0h108v20c0 10.5-8.5 19-19 19h-70c-10.5 0-19-8.5-19-19V0Z" fill="#000"/>
    <circle cx="320" cy="15" r="3.4" fill="#12141c"/>
    <circle cx="320" cy="15" r="1.6" fill="#2a3a55"/>

    <!-- soft glow linking the notch to the search bar below it -->
    <ellipse cx="320" cy="120" rx="210" ry="90" fill="#55b9e8" opacity=".14" filter="url(#soft)"/>

    <!-- floating search pill -->
    <g>
      <rect x="78" y="92" width="484" height="78" rx="39" fill="url(#pillFill)"/>
      <rect x="78" y="92" width="484" height="78" rx="39" fill="none" stroke="url(#pillStroke)" stroke-width="1.4"/>

      <!-- magnifying glass -->
      <circle cx="122" cy="131" r="11" fill="none" stroke="#eef3fa" stroke-width="3" stroke-linecap="round"/>
      <path d="M130 139l9 9" stroke="#eef3fa" stroke-width="3" stroke-linecap="round"/>

      <text x="154" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="600" fill="#eef3fa">Search Wikipedia</text>

      <!-- close affordance, echoing the real app -->
      <circle cx="524" cy="131" r="13" fill="#ffffff" fill-opacity=".14"/>
      <path d="M519 126l10 10m0-10-10 10" stroke="#eef3fa" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- caption chip -->
    <g transform="translate(320 240)" text-anchor="middle">
      <text y="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600" letter-spacing=".05em" fill="#8a94a6">
        <tspan fill="#55b9e8">One shortcut</tspan> — anywhere in macOS
      </text>
    </g>
  </g>

  <!-- screen bezel outline -->
  <path d="M18 0h604c10 0 18 8 18 18v402H0V18C0 8 8 0 18 0Z" fill="none" stroke="#2a2d38" stroke-width="2"/>
</svg>
